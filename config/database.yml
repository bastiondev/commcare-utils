# PostgreSQL. Versions 9.3 and up are supported.
#
#   gem install pg
#
#   Ensure the pg gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # Must cover both Puma threads (RAILS_MAX_THREADS) and the good_job worker,
  # which needs GOOD_JOB_MAX_THREADS + 2 (LISTEN/NOTIFY and cron connections).
  pool: <%= [ENV.fetch("RAILS_MAX_THREADS", 3).to_i, ENV.fetch("GOOD_JOB_MAX_THREADS", 5).to_i + 2].max %>
  url: <%= ENV["DATABASE_URL"] %>
  schema_search_path: "public"

development:
  primary:
    <<: *default

test:
  primary:
    <<: *default

production:
  primary:
    <<: *default
